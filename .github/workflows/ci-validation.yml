name: Bot Container & Code Validation
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Mock Environment File
        run: echo "DISCORD_TOKEN=ci_runner_dummy_token_value" > .env

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run PyTest Code Verification Suite
        run: |
          if [ -f test_bot.py ]; then
            pytest test_bot.py -v
          else
            echo "No test file found, skipping."
          fi

      - name: Validate Docker Build Layout
        run: docker compose build
